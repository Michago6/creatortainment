[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatortainment"
version = "0.1.0"
description = "Script-driven short-form video generation pipeline"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
full = [
  "moviepy>=1.0",
  "pydantic>=2.0",
  "elevenlabs>=1.0",
  "pytest>=8.0",
]
