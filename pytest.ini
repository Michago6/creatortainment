[pytest]
# Temporary MoviePy 2.2.1/NumPy 2.5 compatibility workaround. Keep NumPy
# current and suppress only this third-party warning until MoviePy ships its
# upstream reshape fix; remove this filter then.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\.5\.:DeprecationWarning
